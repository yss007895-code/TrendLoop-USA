<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#1a1a1a"/>
  <rect x="0" y="0" width="600" height="6" fill="#6366F1"/>
  <!-- Grid pattern -->
  <line x1="0" y1="100" x2="600" y2="100" stroke="#6366F1" stroke-width="0.3" opacity="0.15"/>
  <line x1="0" y1="200" x2="600" y2="200" stroke="#6366F1" stroke-width="0.3" opacity="0.15"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="#6366F1" stroke-width="0.3" opacity="0.15"/>
  <line x1="150" y1="0" x2="150" y2="400" stroke="#6366F1" stroke-width="0.3" opacity="0.15"/>
  <line x1="300" y1="0" x2="300" y2="400" stroke="#6366F1" stroke-width="0.3" opacity="0.15"/>
  <line x1="450" y1="0" x2="450" y2="400" stroke="#6366F1" stroke-width="0.3" opacity="0.15"/>
  <!-- Badge -->
  <rect x="30" y="30" width="auto" height="28" rx="4" fill="#6366F1" opacity="0.9"/>
  <text x="42" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="white" letter-spacing="1.5">REMOTE WORK GUIDE</text>
  <!-- Title -->
  <text x="30" y="200" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="white" letter-spacing="-0.5">
    Digital Nomad Cities
  </text>
  <!-- Brand -->
  <text x="30" y="370" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6366F1" letter-spacing="3" opacity="0.8">TRENDLOOP USA</text>
</svg>